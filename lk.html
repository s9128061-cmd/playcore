<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — PLAYCORE</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1c2e;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        header {
            background: #163A5C;
            padding: 15px 0;
            width: 100%;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .logo-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }
        .logo-img { height: 40px; width: auto; }
        .logo-text {
            font-size: 28px;
            font-weight: 900;
            border: 2px solid #fff;
            padding: 2px 12px;
            background: #0a1c2e;
            border-radius: 10px;
        }
        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: 700; font-size: 16px; }
        nav a:hover { opacity: 0.8; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        .sidebar {
            background: #163A5C;
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 30px;
        }
        .sidebar .user-info {
            text-align: center;
            margin-bottom: 30px;
        }
        .sidebar .user-info .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #4fc3f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            margin: 0 auto 15px;
        }
        .sidebar .user-info h3 {
            font-size: 20px;
            font-weight: 700;
        }
        .sidebar .user-info p {
            color: #aaa;
            font-size: 14px;
        }
        .sidebar-menu {
            list-style: none;
        }
        .sidebar-menu li {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.3s;
        }
        .sidebar-menu li:hover {
            background: rgba(255,255,255,0.05);
        }
        .sidebar-menu li.active {
            background: rgba(255,255,255,0.1);
            border-left: 3px solid #4fc3f7;
        }
        .main-content {
            background: #163A5C;
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 30px;
        }
        .main-content h3 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 20px;
        }
        .order-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid #fff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .order-card .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-card .order-status {
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }
        .order-card .order-status.new {
            background: #4fc3f7;
            color: #0a1c2e;
        }
        .order-card .order-status.done {
            background: #21A038;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #fff;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        .form-group input::placeholder {
            color: #888;
        }
        .btn-primary {
            padding: 12px 30px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 13px;
            color: white;
            border: 2px solid #fff;
            background: transparent;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: white;
            color: #0a1c2e;
        }
        .btn-logout {
            padding: 10px 30px;
            font-size: 14px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background: white;
            color: #0a1c2e;
        }
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                padding: 20px;
            }
            .main-content {
                padding: 20px;
            }
            .sidebar .user-info .avatar {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            .sidebar .user-info h3 {
                font-size: 18px;
            }
            .sidebar .user-info p {
                font-size: 12px;
            }
            .sidebar-menu li {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo-area">
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="PLAYCORE" class="logo-img">
                <div class="logo-text">PLAYCORE</div>
            </a>
        </div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="cart.html">Корзина</a>
            <a href="profile.html">Вход</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="dashboard-grid">
        <div class="sidebar">
            <div class="user-info">
                <div class="avatar">👤</div>
                <h3 id="userName">Гость</h3>
                <p id="userEmail">Не авторизован</p>
            </div>
            <ul class="sidebar-menu">
                <li class="active" onclick="switchTab('orders')">📦 Заказы</li>
                <li onclick="switchTab('profile')">👤 Профиль</li>
            </ul>
        </div>
        <div class="main-content">
            <div id="tab-orders" class="tab-content active">
                <h3>📦 Ваши заказы</h3>
                <div id="ordersList">
                    <p style="text-align: center; color: #aaa;">Заказов пока нет</p>
                </div>
            </div>
            <div id="tab-profile" class="tab-content">
                <h3>👤 Данные профиля</h3>
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="nameInput" placeholder="Введите ваше имя">
                </div>
                <div class="form-group">
                    <label>Номер телефона</label>
                    <input type="tel" id="phoneInput" placeholder="+7 (999) 999-99-99">
                </div>
                <div class="form-group">
                    <label>Адрес доставки</label>
                    <input type="text" id="addressInput" placeholder="Город, улица, дом, квартира">
                </div>
                <button class="btn-primary" onclick="saveProfile()">Сохранить данные</button>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 PLAYCORE. Все права защищены.</p>
</footer>

<script>
    const user = localStorage.getItem('fakeUser');
    if (!user) {
        window.location.href = 'profile.html';
    } else {
        const users = JSON.parse(localStorage.getItem('fakeUsers')) || [];
        const currentUser = users.find(u => u.email === user);
        if (currentUser) {
            document.getElementById('userName').innerText = currentUser.name || currentUser.email.split('@')[0];
            document.getElementById('userEmail').innerText = currentUser.email;
        }
    }

    function logout() {
        localStorage.removeItem('fakeUser');
        window.location.href = 'profile.html';
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.sidebar-menu li').forEach(el => el.classList.remove('active'));
        const tab = document.getElementById(`tab-${tabId}`);
        if (tab) tab.classList.add('active');
        event.target.closest('li').classList.add('active');
    }

    function saveProfile() {
        const name = document.getElementById('nameInput').value;
        const phone = document.getElementById('phoneInput').value;
        const address = document.getElementById('addressInput').value;
        const users = JSON.parse(localStorage.getItem('fakeUsers')) || [];
        const user = localStorage.getItem('fakeUser');
        const index = users.findIndex(u => u.email === user);
        if (index !== -1) {
            users[index].name = name;
            users[index].phone = phone;
            users[index].address = address;
            localStorage.setItem('fakeUsers', JSON.stringify(users));
            alert('Данные сохранены!');
        }
    }
</script>
</body>
</html>
