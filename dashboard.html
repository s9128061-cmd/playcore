<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — PLAYCORE</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1c2e;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        header {
            background: #163A5C;
            padding: 15px 0;
            width: 100%;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .logo-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }
        .logo-img { height: 40px; width: auto; }
        .logo-text {
            font-size: 28px;
            font-weight: 900;
            border: 2px solid #fff;
            padding: 2px 12px;
            background: #0a1c2e;
            border-radius: 10px;
        }
        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: 700; font-size: 16px; }
        nav a:hover { opacity: 0.8; }
        
        .auth-card {
            background: #163A5C;
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            text-align: center;
        }
        .auth-card h2 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #fff;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        .form-group input::placeholder { color: #888; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-primary {
            flex: 1;
            padding: 12px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 13px;
            color: white;
            border: 2px solid #fff;
            background: transparent;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: white;
            color: #0a1c2e;
        }
        .btn-secondary {
            flex: 1;
            padding: 12px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 13px;
            background: #ffffff;
            color: #0a1c2e;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover {
            transform: scale(1.03);
        }
        .btn-logout {
            padding: 10px 30px;
            font-size: 14px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background: white;
            color: #0a1c2e;
        }
        .hidden {
            display: none !important;
        }
        footer {
            padding: 20px 0;
            text-align: center;
        }
        footer p {
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo-area">
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="PLAYCORE" class="logo-img">
                <div class="logo-text">PLAYCORE</div>
            </a>
        </div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="cart.html">Корзина</a>
            <a href="profile.html">Вход</a>
        </nav>
    </div>
</header>

<div class="container">
    <div id="cabinetSection" class="auth-card">
        <h2>Здравствуйте, <span id="userName">Клиент</span>!</h2>
        <button class="btn-logout" onclick="logout()">Выйти</button>
    </div>
</div>

<footer>
    <p>© 2026 PLAYCORE. Все права защищены.</p>
    </footer>
</div>

<script>
    // Проверяем, есть ли пользователь в сессии
    const user = localStorage.getItem('fakeUser');
    if (!user) {
        // Если нет — перенаправляем на вход
        window.location.href = 'profile.html';
    } else {
        document.getElementById('userName').innerText = user;
    }

    function logout() {
        localStorage.removeItem('fakeUser');
        window.location.href = 'profile.html';
    }
</script>
</body>
</html>
