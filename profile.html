<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — PLAYCORE</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a1c2e;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            padding: 20px;
        }
        .auth-card {
            background: #163A5C;
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 40px;
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #fff;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-primary,
        .btn-secondary {
            flex: 1;
            padding: 12px;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #fff;
            color: #0a1c2e;
        }
        .btn-secondary {
            background: #fff;
            border: none;
            color: #0a1c2e;
        }
        .btn-secondary:hover {
            transform: scale(1.05);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="authSection" class="auth-card">
            <h2>🔐 Вход в кабинет</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="Введите email">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль">
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="login()">Войти</button>
                <button class="btn-secondary" onclick="register()">Регистрация</button>
            </div>
        </div>

        <div id="cabinetSection" class="auth-card hidden">
            <h2>✅ Добро пожаловать!</h2>
            <p>Вы успешно вошли в кабинет.</p>
            <div class="btn-group">
                <button class="btn-primary" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== НАСТРОЙКИ SUPABASE =====
        const supabaseUrl = 'https://txggpeipjeimilodbeh.supabase.co';
        const supabaseKey = 'sb_publishable_BWgClmR6K2D7WrrJ-FSUCA_VdEkYVsd';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // ===== Регистрация =====
        async function register() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) {
                alert('Заполните email и пароль');
                return;
            }
            if (password.length < 6) {
                alert('Пароль должен быть не менее 6 символов');
                return;
            }
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert('❌ Ошибка регистрации: ' + error.message);
            } else {
                alert('✅ Регистрация прошла успешно!');
                // Пытаемся войти сразу
                const { error: loginError } = await supabase.auth.signInWithPassword({ email, password });
                if (loginError) {
                    alert('Ошибка входа после регистрации: ' + loginError.message);
                } else {
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('cabinetSection').classList.remove('hidden');
                }
            }
        }

        // ===== Вход =====
        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) {
                alert('Заполните email и пароль');
                return;
            }
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('❌ Ошибка входа: ' + error.message);
            } else {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('cabinetSection').classList.remove('hidden');
            }
        }

        // ===== Выход =====
        async function logout() {
            await supabase.auth.signOut();
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('cabinetSection').classList.add('hidden');
        }

        // ===== Проверка сессии =====
        async function checkSession() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('cabinetSection').classList.remove('hidden');
            }
        }
        checkSession();
    </script>

</body>
</html>
