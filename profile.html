<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в кабинет — PLAYCORE</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1c2e;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        header {
            background: #163A5C;
            padding: 15px 0;
            width: 100%;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .logo-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }
        .logo-img { height: 40px; width: auto; }
        .logo-text {
            font-size: 28px;
            font-weight: 900;
            border: 2px solid #fff;
            padding: 2px 12px;
            background: #0a1c2e;
            border-radius: 10px;
        }
        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: 700; font-size: 16px; }
        nav a:hover { opacity: 0.8; }
        .auth-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
        }
        .auth-card {
            background: #163A5C;
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
        }
        .auth-card h2 {
            font-size: 28px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
        }
        .auth-card .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #fff;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        .form-group input::placeholder { color: #888; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-primary {
            flex: 1;
            padding: 12px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 13px;
            color: white;
            border: 2px solid #fff;
            background: transparent;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: white;
            color: #0a1c2e;
        }
        .btn-secondary {
            flex: 1;
            padding: 12px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 13px;
            background: #ffffff;
            color: #0a1c2e;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover {
            transform: scale(1.03);
        }
        .btn-logout {
            padding: 10px 30px;
            font-size: 14px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background: white;
            color: #0a1c2e;
        }
        .hidden {
            display: none !important;
        }
        footer {
            padding: 20px 0;
            text-align: center;
        }
        footer p {
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo-area">
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="PLAYCORE" class="logo-img">
                <div class="logo-text">PLAYCORE</div>
            </a>
        </div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="cart.html">Корзина</a>
            <a href="dashboard.html">Кабинет</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="auth-section">
        <div id="authSection" class="auth-card">
            <h2>Вход в кабинет</h2>
            <p class="subtitle">Войдите, чтобы видеть историю заказов</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="Введите email">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль">
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="login()">Войти</button>
                <button class="btn-secondary" onclick="register()">Регистрация</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 PLAYCORE. Все права защищены.</p>
    </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA7Z6xfmWTwdOl5N-OU8HOIi6kmKPBasN4",
        authDomain: "playcore-9dbc0.firebaseapp.com",
        projectId: "playcore-9dbc0",
        storageBucket: "playcore-9dbc0.firebasestorage.app",
        messagingSenderId: "535998996764",
        appId: "1:535998996764:web:ad113c9fd358a1079a9ad9",
        measurementId: "G-YVZJLC7SYG"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    console.log('🔥 Firebase инициализирован');

    // ===== Регистрация =====
    async function register() {
        console.log('Нажата кнопка Регистрация');
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) {
            alert('Введите email и пароль');
            return;
        }
        try {
            console.log('Попытка регистрации:', email);
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            console.log('Пользователь создан:', userCredential.user.uid);
            await userCredential.user.sendEmailVerification();
            alert('Регистрация успешна! На вашу почту отправлено письмо для подтверждения.');
            await auth.signOut();
        } catch (error) {
            console.error('Ошибка регистрации:', error);
            alert('Ошибка: ' + error.message);
        }
    }

    // ===== Вход =====
    async function login() {
        console.log('Нажата кнопка Войти');
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) {
            alert('Введите email и пароль');
            return;
        }
        try {
            console.log('Попытка входа:', email);
            await auth.signInWithEmailAndPassword(email, password);
            console.log('Вход успешен!');
            window.location.href = 'dashboard.html';
        } catch (error) {
            console.error('Ошибка входа:', error);
            alert('Ошибка: ' + error.message);
        }
    }
</script>
</body>
</html>
