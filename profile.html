<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет — PLAYCORE</title>
</head>
<body>
    <h2>Регистрация / Вход</h2>
    <input type="email" id="emailInput" placeholder="Email">
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAZz6xPmTw0l5N-OU8HOI6kmKPBasH4",
            authDomain: "playcore-9dbc0.firebaseapp.com",
            projectId: "playcore-9dbc0",
            storageBucket: "playcore-9dbc0.firebasestorage.app",
            messagingSenderId: "535998996764",
            appId: "1:535998996764:web:ad113c9fd358a1079a9d9"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        async function register() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) {
                alert('Введите email и пароль');
                return;
            }
            try {
                await auth.createUserWithEmailAndPassword(email, password);
                alert('Регистрация успешна!');
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) {
                alert('Введите email и пароль');
                return;
            }
            try {
                await auth.signInWithEmailAndPassword(email, password);
                alert('Вход успешен!');
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
    </script>
</body>
</html>
