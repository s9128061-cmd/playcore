<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет — PLAYCORE</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a1c2e; color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 500px; margin: 0 auto; padding: 0 20px; width: 100%; }
        .cabinet-card { background: #163A5C; border: 2px solid #fff; border-radius: 20px; padding: 30px; margin-top: 50px; }
        .cabinet-card h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 700; }
        .form-group input { width: 100%; padding: 10px; border: 2px solid #fff; border-radius: 12px; background: rgba(255,255,255,0.05); color: #fff; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-primary, .btn-secondary { flex: 1; padding: 12px; border-radius: 30px; border: 2px solid #fff; cursor: pointer; font-weight: 700; }
        .btn-primary { background: transparent; color: white; }
        .btn-secondary { background: white; color: #0a1c2e; border: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="authSection" class="cabinet-card">
        <h2>Вход в кабинет</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="emailInput" placeholder="Введите email">
        </div>
        <div class="form-group">
            <label>Номер телефона</label>
            <input type="tel" id="phoneInput" placeholder="+7 (999) 999-99-99">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="passwordInput" placeholder="Введите пароль">
        </div>
        <div class="btn-group">
            <button class="btn-primary" onclick="login()">Войти</button>
            <button class="btn-secondary" onclick="register()">Регистрация</button>
        </div>
    </div>

    <div id="cabinetSection" class="cabinet-card hidden">
        <h2>Добро пожаловать!</h2>
        <p>Вы успешно вошли в кабинет.</p>
        <button class="btn-primary" onclick="logout()">Выйти</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://txggpeipjeimilodbeh.supabase.co';
    const supabaseKey = 'sb_publishable_BWgClmR6K2D7WrrJ-FSUCA_VdEkYVsd';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function register() {
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) {
            alert('Заполните email и пароль');
            return;
        }
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) {
            alert('Ошибка: ' + error.message);
        } else {
            alert('Регистрация успешна!');
            // Автоматический вход
            const { error: loginError } = await supabase.auth.signInWithPassword({ email, password });
            if (loginError) {
                alert('Ошибка входа: ' + loginError.message);
            } else {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('cabinetSection').classList.remove('hidden');
            }
        }
    }

    async function login() {
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) {
            alert('Заполните email и пароль');
            return;
        }
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            alert('Ошибка входа: ' + error.message);
        } else {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('cabinetSection').classList.remove('hidden');
        }
    }

    async function logout() {
        await supabase.auth.signOut();
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('cabinetSection').classList.add('hidden');
    }

    // Проверка сессии при загрузке
    async function checkSession() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('cabinetSection').classList.remove('hidden');
        }
    }
    checkSession();
</script>
</body>
</html>
