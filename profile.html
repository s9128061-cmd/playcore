<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — PLAYCORE</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1c2e;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; width: 100%; }
        header {
            background: #163A5C;
            padding: 15px 0;
            border-bottom: 2px solid #fff;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }
        .logo-img { height: 40px; width: auto; }
        .logo-text {
            font-size: 28px;
            font-weight: 900;
            border: 2px solid #fff;
            padding: 2px 12px;
            background: #0a1c2e;
            border-radius: 10px;
        }
        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: 700; font-size: 16px; }
        nav a:hover { opacity: 0.8; }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }
        .cabinet-card {
            background: #163A5C;
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }
        .cabinet-card h2 {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
        }
        .cabinet-card .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #fff;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4fc3f7;
            background: rgba(255,255,255,0.1);
        }
        .form-group input::placeholder { color: #888; }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-primary {
            flex: 1;
            padding: 14px;
            font-weight: 900;
            text-transform: uppercase;
            color: white;
            border: 2px solid #fff;
            background: transparent;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { background: white; color: #0a1c2e; }
        .btn-secondary {
            flex: 1;
            background: #ffffff;
            color: #0a1c2e;
            padding: 14px;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover { transform: scale(1.03); }
        .btn-logout {
            background: transparent;
            border: 2px solid #ff4444;
            color: #ff4444;
            padding: 8px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #ff4444; color: #fff; }
        .order-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid #fff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .order-status {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }
        .status-new { background: #4fc3f7; color: #0a1c2e; }
        .status-done { background: #21A038; color: white; }
        .cabinet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .cabinet-header h3 { font-size: 24px; font-weight: 700; }
        .hidden { display: none !important; }
        footer {
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        footer p { font-size: 14px; color: #888; }
        @media (max-width: 600px) {
            .cabinet-card { padding: 30px 20px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <div class="container header-inner">
        <div class="logo-area">
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="PLAYCORE" class="logo-img">
                <div class="logo-text">PLAYCORE</div>
            </a>
        </div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="cart.html">Корзина</a>
            <a href="profile.html">Кабинет</a>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <!-- Форма входа -->
        <div id="authSection" class="cabinet-card">
            <h2>Вход в кабинет</h2>
            <p class="subtitle">Войдите, чтобы видеть историю заказов</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="Введите email">
            </div>
            <div class="form-group">
                <label>Номер телефона</label>
                <input type="tel" id="phoneInput" placeholder="+7 (999) 999-99-99">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль">
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="login()">Войти</button>
                <button class="btn-secondary" onclick="register()">Регистрация</button>
            </div>
        </div>

        <!-- Кабинет (скрыто до входа) -->
        <div id="cabinetSection" class="cabinet-card hidden">
            <div class="cabinet-header">
                <h3>Здравствуйте, <span id="userName">Клиент</span>!</h3>
                <button class="btn-logout" onclick="logout()">Выйти</button>
            </div>
            <div style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px;">
                <p><strong>Email:</strong> <span id="displayEmail">—</span></p>
                <p><strong>Телефон:</strong> <span id="displayPhone">—</span></p>
            </div>
            <h4 style="font-size: 18px; margin-bottom: 20px;">Ваши заказы</h4>
            <div id="ordersList">
                <p style="text-align: center; color: #aaa;">Заказов пока нет</p>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p>© 2026 PLAYCORE. Все права защищены.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ===== НАСТРОЙКИ SUPABASE =====
    const supabaseUrl = 'https://txggpeipjeimilodbeh.supabase.co';
    const supabaseKey = 'sb_publishable_BWgClmR6K2D7WrrJ-FSUCA_VdEkYVsd';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    const TABLE_NAME = 'orders';

    // ===== Регистрация (Создание пользователя) =====
    async function register() {
        const email = document.getElementById('emailInput').value;
        const phone = document.getElementById('phoneInput').value;
        const password = document.getElementById('passwordInput').value;

        if (!email || !password) {
            alert('Введите email и пароль');
            return;
        }
        if (password.length < 6) {
            alert('Пароль должен быть не менее 6 символов');
            return;
        }

        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                data: { phone: phone }
            }
        });

        if (error) {
            alert('Ошибка регистрации: ' + error.message);
        } else {
            alert('Регистрация успешна! Письмо с подтверждением отправлено на вашу почту.');
            // После подтверждения почты пользователь сможет войти
            // Но для тестирования мы попробуем войти сразу
            const { error: loginError } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });
            if (loginError) {
                alert('Ошибка входа после регистрации: ' + loginError.message);
            } else {
                showCabinet();
            }
        }
    }

    // ===== Вход =====
    async function login() {
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;

        if (!email || !password) {
            alert('Введите email и пароль');
            return;
        }

        const { error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert('Ошибка входа: ' + error.message);
        } else {
            showCabinet();
        }
    }

    // ===== Выход =====
    async function logout() {
        await supabase.auth.signOut();
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('cabinetSection').classList.add('hidden');
        document.getElementById('emailInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('phoneInput').value = '';
    }

    // ===== Показать кабинет =====
    function showCabinet() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('cabinetSection').classList.remove('hidden');
        const user = supabase.auth.getUser();
        document.getElementById('userName').innerText = user.email;
        document.getElementById('displayEmail').innerText = user.email;
        document.getElementById('displayPhone').innerText = user.user_metadata?.phone || '—';
        loadOrders();
    }

    // ===== Загрузить заказы =====
    async function loadOrders() {
        const user = await supabase.auth.getUser();
        const { data, error } = await supabase
            .from(TABLE_NAME)
            .select('*')
            .eq('user_id', user.data.user.id)
            .order('created_at', { ascending: false });
        const container = document.getElementById('ordersList');
        if (error) {
            container.innerHTML = '<p style="text-align: center; color: #ff4444;">Ошибка загрузки заказов</p>';
            return;
        }
        if (data.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #aaa;">Заказов пока нет</p>';
            return;
        }
        let html = '';
        data.forEach(order => {
            const statusClass = order.status === 'new' ? 'status-new' : 'status-done';
            const date = new Date(order.created_at).toLocaleString();
            html += `
                <div class="order-card">
                    <p><strong>Заказ #${order.id}</strong> — ${date}</p>
                    <p>Сумма: <strong>${order.total} ₽</strong></p>
                    <span class="order-status ${statusClass}">${order.status}</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ===== Проверка сессии при загрузке =====
    async function checkSession() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            showCabinet();
        }
    }
    checkSession();
</script>
</body>
</html>
