<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет — PLAYCORE</title>
</head>
<body>
    <h2>Регистрация / Вход</h2>
    <div id="authSection">
        <input type="email" id="emailInput" placeholder="Email">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button onclick="register()">Регистрация</button>
        <button onclick="login()">Войти</button>
    </div>

    <div id="cabinetSection" style="display:none">
        <h2>Добро пожаловать!</h2>
        <p>Вы успешно вошли в кабинет.</p>
        <button onclick="logout()">Выйти</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA7Z6xfmWTwdOl5N-OU8HOIi6kmKPBasN4",
            authDomain: "playcore-9dbc0.firebaseapp.com",
            projectId: "playcore-9dbc0",
            storageBucket: "playcore-9dbc0.firebasestorage.app",
            messagingSenderId: "535998996764",
            appId: "1:535998996764:web:ad113c9fd358a1079a9ad9",
            measurementId: "G-YVZJLC7SYG"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        async function register() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) {
                alert('Введите email и пароль');
                return;
            }
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                // Отправляем письмо с подтверждением
                await userCredential.user.sendEmailVerification();
                alert('На вашу почту отправлено письмо с ссылкой для подтверждения. Перейдите по ней, а затем войдите.');
                // Выходим, чтобы пользователь вошёл после подтверждения
                await auth.signOut();
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) {
                alert('Введите email и пароль');
                return;
            }
            try {
                await auth.signInWithEmailAndPassword(email, password);
                const user = auth.currentUser;
                // Проверяем, подтверждён ли email
                if (user && user.emailVerified) {
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('cabinetSection').style.display = 'block';
                    alert('Вход успешен!');
                } else {
                    alert('Email не подтверждён. Перейдите по ссылке в письме.');
                    await auth.signOut();
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function logout() {
            await auth.signOut();
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('cabinetSection').style.display = 'none';
        }

        auth.onAuthStateChanged(user => {
            if (user && user.emailVerified) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('cabinetSection').style.display = 'block';
            }
        });
    </script>
</body>
</html>
